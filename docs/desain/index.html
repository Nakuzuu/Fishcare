<!doctype html>
<html lang="id">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FishCare — Desain aplikasi baru</title>
<style>
:root{--ink:#173c39;--muted:#546e69;--green:#12685d;--soft:#e4f3eb;--paper:#f6f8f4;--line:#d9e4dd;--amber:#805512;--red:#a23e36}*{box-sizing:border-box}body{margin:0;font:15px/1.5 'Segoe UI',Arial,sans-serif;color:var(--ink);background:#e9eeea}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}header.studio{padding:32px 5vw 22px;border-bottom:1px solid #cdd8d0;background:#f8faf7}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;text-transform:uppercase;color:var(--green)}header.studio h1{font-size:30px;letter-spacing:-1px;margin:6px 0}header.studio p{max-width:780px;margin:8px 0;color:var(--muted)}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}.tools select{max-width:100%;background:white;padding:12px;border:1px solid #becfc4;border-radius:10px;color:var(--ink)}.tools button{padding:12px 18px;border:1px solid var(--green);border-radius:10px;background:var(--green);color:white;min-height:48px}.tools button.secondary{background:transparent;color:var(--green)}.workspace{display:grid;grid-template-columns:245px minmax(0,1fr);max-width:1250px;margin:28px auto;gap:30px;padding:0 24px}.index{max-height:800px;overflow:auto}.index button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;color:var(--muted);border-radius:9px;min-height:44px}.index button.active{background:#d4e8dc;color:var(--ink);font-weight:700}.index .group{margin:20px 12px 7px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--green)}.stage{display:flex;justify-content:center;align-items:flex-start;gap:24px}.phone{background:var(--paper);width:390px;max-width:100%;height:830px;border:8px solid #24433e;border-radius:38px;overflow:hidden;box-shadow:0 18px 45px #1e48371a;display:flex;flex-direction:column;position:relative}.status{display:flex;justify-content:space-between;padding:11px 22px 4px;font-size:12px;font-weight:700;background:var(--paper);flex-shrink:0}.appbar{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;min-height:66px;flex-shrink:0}.appbar h2{font-size:23px;letter-spacing:-.6px;line-height:1.2;margin:0;flex:1}.iconbtn{border:1px solid var(--line);background:white;border-radius:14px;min-width:46px;min-height:46px;color:var(--ink);display:grid;place-items:center}.icon{width:22px;height:22px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.content{padding:0 18px 24px;overflow:auto;flex:1;min-height:0;scrollbar-width:thin}.small{font-size:12px;color:var(--muted)}.section{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:21px 0 10px}.section h3{font-size:16px;margin:0}.textlink{border:0;background:none;color:var(--green);font-size:13px;min-height:44px;padding:5px;font-weight:600}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}.card h3{font-size:17px;margin:0 0 4px}.hero{background:var(--green);border:0;color:white;padding:20px;position:relative;overflow:hidden}.hero .small{color:#d4eee3}.hero .badge{background:#ffffff20;color:white}.hero strong{font-size:36px;letter-spacing:-1px;line-height:1.3}.hero .pair{margin-top:16px;border-top:1px solid #ffffff30;padding-top:14px}.pair{display:flex;justify-content:space-between;align-items:center;gap:12px}.pair.wrap{flex-wrap:wrap}.badge{display:inline-block;background:var(--soft);color:#245e47;padding:4px 9px;border-radius:7px;font-size:11px;font-weight:700;white-space:nowrap}.badge.warn{color:var(--amber);background:#fcf0d6}.badge.red{color:var(--red);background:#fceae7}.value{font-size:25px;font-weight:700;letter-spacing:-.5px}.value span{font-size:13px;font-weight:400;letter-spacing:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .card{margin:0}.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:11px 13px;border-radius:12px;border:0;background:var(--green);color:white;font-weight:600;text-decoration:none;margin-top:12px}.btn.outline{background:white;border:1px solid var(--line);color:var(--green)}.btn.danger{background:var(--red)}.btn:disabled{background:#e4e9e5;color:#586b62;cursor:not-allowed}.row{padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row strong{font-size:14px}.row .small{margin-top:3px}.slot{display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:8px}.slot time{font-size:16px;font-weight:700}.nav{display:flex;background:white;border-top:1px solid var(--line);flex-shrink:0;padding:8px 5px 12px}.nav button{flex:1;min-height:54px;border:0;background:none;color:var(--muted);font-size:11px;display:flex;align-items:center;flex-direction:column;gap:5px}.nav button.active{color:var(--green);font-weight:700}.nav button.active .icon{background:var(--soft);box-sizing:content-box;padding:3px 12px;border-radius:12px}.nav .icon{box-sizing:content-box;padding:3px 12px}.tabs{display:flex;background:#e7eee8;border-radius:11px;padding:4px;margin:10px 0 18px;gap:4px}.tabs button{flex:1;border:0;background:none;color:var(--muted);min-height:42px;border-radius:8px;font-size:13px}.tabs .on{background:white;color:var(--green);font-weight:700;box-shadow:0 2px 4px #00000008}label{display:block;font-weight:600;font-size:13px;margin:17px 0 7px}input,select,textarea{width:100%;border:1px solid #b7cbbf;background:white;border-radius:11px;padding:12px;color:var(--ink);min-height:48px}textarea{resize:vertical;min-height:85px}.field{display:flex;border:1px solid #b7cbbf;border-radius:11px;overflow:hidden;background:white;align-items:center}.field input{border:0;border-radius:0;min-width:0}.field span{padding:0 13px;color:var(--muted);font-size:13px;white-space:nowrap}.hint{font-size:12px;color:var(--muted);margin-top:6px}.notice{background:var(--soft);padding:13px;border-radius:12px;font-size:13px;margin:12px 0}.notice.warn{background:#fcf0d6;color:var(--amber)}.notice.error{background:#fceae7;color:var(--red)}.kv{display:flex;justify-content:space-between;gap:18px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.kv span{color:var(--muted)}.kv b{text-align:right;max-width:60%}.footer{padding:10px 18px 18px;background:var(--paper);border-top:1px solid var(--line);flex-shrink:0}.footer .btn{margin-top:0}.empty{text-align:center;padding:55px 14px}.empty .symbol{background:var(--soft);width:70px;height:70px;border-radius:24px;display:grid;place-items:center;margin:0 auto 22px}.empty h3{font-size:20px;margin:0 0 9px}.empty p{color:var(--muted);font-size:14px}.weather{background:#edf3f6;border-color:#d6e2e9}.weather .value{font-size:34px}.note{width:230px;padding-top:15px;flex-shrink:0;color:var(--muted);font-size:13px}.note h3{color:var(--ink);font-size:16px}.note ul{padding-left:18px}.note li{margin:12px 0}.spec{border-top:1px solid #becfc4;margin-top:24px;padding-top:18px}.mark{display:flex;align-items:center;gap:8px;font-weight:750;color:var(--green);font-size:24px;letter-spacing:-.8px}.skeleton{height:95px;border-radius:16px;background:linear-gradient(90deg,#e0e9e1,#f0f4ef,#e0e9e1);background-size:200% 100%;animation:load 2s infinite;margin:12px 0}@keyframes load{to{background-position:-200% 0}}.keyboard{background:#d9e1de;padding:10px;flex-shrink:0}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.keys span{background:white;text-align:center;padding:6px;border-radius:5px;font-size:18px}.keyboard .small{text-align:center;margin-top:6px}.board{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;padding:32px;max-width:1900px;margin:auto}.board .phone{width:100%;height:830px;border-width:5px;border-radius:26px;box-shadow:none}.board h3.caption{font-size:15px;margin:0 0 12px}.board .content{overflow:auto}.board article{min-width:0}.board .status{padding-left:16px;padding-right:16px}body.gallery .workspace{display:none}body.gallery .board{display:grid}.toast{font-size:13px;border-radius:10px;background:#173c39;color:white;padding:12px;position:absolute;bottom:85px;left:18px;right:18px;z-index:3}.water{height:35px;width:100%;margin:12px 0 0;opacity:.65}a{color:var(--green)}@media(max-width:1000px){.note{display:none}.workspace{grid-template-columns:210px 1fr}.board{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){header.studio{padding:20px}header.studio h1{font-size:26px}.workspace{display:block;padding:0 10px;margin:18px auto}.index{display:none}.phone{height:calc(100dvh - 30px);min-height:650px;max-height:830px}.board{grid-template-columns:1fr;padding:20px}.tools{gap:8px}.tools select{width:100%}}@media print{@page{size:A3 landscape;margin:10mm}body{background:white}header.studio,.workspace{display:none!important}.board{display:grid!important;grid-template-columns:repeat(4,1fr);gap:14px;padding:0}.board article{break-inside:avoid}.board .phone{height:900px;box-shadow:none}.board .content{overflow:hidden}.board article{page-break-inside:avoid}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<style>.hero .pair:first-child{margin-top:0;border-top:0;padding-top:0}</style>
<header class="studio"><div class="eyebrow">Rancangan UI/UX · 15 Oktober 2026 · Draf 01</div><h1>FishCare, dirancang untuk kegiatan di kolam.</h1><p>Desain baru aplikasi Android untuk pencatatan budidaya. Pilih layar atau ikuti tombol di dalam HP. Semua angka, cuaca, dan penyimpanan di sini merupakan simulasi desain.</p><div class="tools"><select aria-label="Pilih layar desain" id="picker"></select><button id="gallery">Lihat semua layar</button><button class="secondary" id="print">Cetak desain</button></div></header>
<main class="workspace"><aside class="index" aria-label="Daftar layar" id="index"></aside><div class="stage"><section class="phone" id="phone" aria-label="Pratinjau aplikasi Android"></section><aside class="note" id="note"></aside></div></main><div class="board" id="board"></div>
<script>
const icons={home:'M3 10 12 3l9 7v11h-6v-7H9v7H3Z',pond:'M3 5h18v14H3ZM3 10q4-4 9 0t9 0M3 15q4-4 9 0t9 0',feed:'M5 7h14l2 14H3ZM9 7V3h6v4M8 12h8m-8 4h5',report:'M5 3h14v18H5ZM8 16v-4m4 4V8m4 8v-6',back:'m14 5-7 7 7 7',gear:'M9 3h6l1 4 4 2v6l-4 2-1 4H9l-1-4-4-2V9l4-2ZM15 12a3 3 0 1 0-6 0 3 3 0 0 0 6 0',plus:'M12 5v14M5 12h14',fish:'M4 12q8-12 15 0-7 12-15 0Zm15 0 4-4v8ZM13 9h.1',pin:'M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0ZM15 10a3 3 0 1 0-6 0 3 3 0 0 0 6 0',sun:'M12 3v2m0 14v2M3 12h2m14 0h2M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2M17 12a5 5 0 1 0-10 0 5 5 0 0 0 10 0',check:'m5 12 4 4L19 6'};
const icon=k=>`<svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="${icons[k]||icons.fish}"/></svg>`;
const btn=(t,to,cls='')=>`<button class="btn ${cls}" data-to="${to}">${t}</button>`;
const link=(t,to)=>`<button class="textlink" data-to="${to}">${t}</button>`;
const badge=(t,c='')=>`<span class="badge ${c}">${t}</span>`;
const kv=(a,b)=>`<div class="kv"><span>${a}</span><b>${b}</b></div>`;
const field=(label,value,unit='',type='text')=>`<label>${label}<div class="field"><input type="${type}" value="${value}" ${unit?'inputmode="decimal"':''} aria-label="${label}">${unit?`<span>${unit}</span>`:''}</div></label>`;
const card=(s,c='')=>`<div class="card ${c}">${s}</div>`;
const notice=(s,c='')=>`<div class="notice ${c}">${s}</div>`;
const section=(t,action='')=>`<div class="section"><h3>${t}</h3>${action}</div>`;
const empty=(title,copy,action)=>`<div class="empty"><div class="symbol">${icon('pond')}</div><h3>${title}</h3><p>${copy}</p>${action||''}</div>`;
const pondCard=(name,pop,weight,to)=>card(`<div class="pair"><h3>${name}</h3>${badge('Siklus aktif')}</div><p class="small">Nila · Pakan A</p><div class="grid2"><div><div class="small">Populasi</div><div class="value">${pop} <span>ekor</span></div></div><div><div class="small">Bobot rata-rata</div><div class="value">${weight} <span>g/ikan</span></div></div></div>${btn('Lihat kolam',to,'outline')}`);
const period=`<div class="small">01–15 Okt 2026 · Semua kolam, termasuk arsip</div>`;
const screens=[
{id:'home',group:'Utama',title:'Beranda',nav:0,fr:'FR-01–04, FR-08 · AT-01, 19–22',notes:['Revisi20Oktober: cuaca tepat setelah header, lalu pakan dan kolam; navigasi lokal tetap independen.','Angka contoh: 100 ikan × 100 g × 3% = 300 g/hari.','Tidak ada permintaan lokasi ketika layar dibuka.'],body:()=>`<div class="pair"><div class="mark">${icon('fish')}FishCare</div><button class="iconbtn" data-to="settings" aria-label="Pengaturan">${icon('gear')}</button></div><p class="small">Kamis, 15 Oktober 2026 · WIB</p>${card(`<h3>Jakarta ? contoh desain</h3><div class="pair"><div class="value" style="font-size:52px">29 ?C</div><span style="transform:scale(2.5);margin-right:24px">${icon('sun')}</span></div><h3>Berawan</h3>${kv('Prakiraan hujan hari ini','60%')}${badge('Contoh desain ? bukan data API')}<p class="small">Data: 15 Okt, 14.00 WIB<br>Diambil: 15 Okt, 14.05 WIB<br>Suhu udara, bukan suhu air ? Open-Meteo</p><div class="grid2">${btn('Atur lokasi','location','outline')}${btn('Muat ulang ? simulasi','home','outline')}</div><details><summary>Detail cuaca ? simulasi</summary><p class="small">Koordinat contoh ?6,20; 106,82<br>Waktu penyedia15Okt14.00WIB; pengambilan14.05WIB.<br>Seluruh angka adalah data rancangan, bukan cuaca pengguna.</p></details>`,'weather')}${card(`<div class="pair"><div class="small">Pakan hari ini · Kolam Utara</div>${badge('1 slot menunggu')}</div><p><strong>150 <span style="font-size:16px">g tersisa</span></strong></p><div class="small">Kebutuhan 300 g · Diberikan 150 g</div><div class="pair"><span>Berikutnya · 16.00</span><span>150 g</span></div>${btn('Buka pakan hari ini','feed','outline')}`,'hero')}${section('Kolam aktif',link('Lihat semua','ponds'))}${pondCard('Kolam Utara','100','100','pond')}`},
{id:'ponds',group:'Kolam dan siklus',title:'Kolam',nav:1,fr:'FR-01–02 · AT-01, 19',notes:['Kolam arsip tetap memiliki riwayat dan dapat masuk laporan.','Kolam dengan siklus aktif tidak dapat diarsipkan.'],body:()=>`<div class="tabs"><button class="on">Aktif</button><button data-to="empty">Arsip</button></div>${btn('+ Tambah kolam','pondform')}${section('1 kolam dengan siklus aktif')}${pondCard('Kolam Utara','100','100','pond')}${card(`<div class="pair"><h3>Kolam Selatan</h3>${badge('Belum ada siklus','warn')}</div><p class="small">Buat siklus untuk mulai mencatat kegiatan.</p>${btn('Mulai siklus','cycle','outline')}`)}`},
{id:'pondform',group:'Kolam dan siklus',title:'Tambah kolam',back:'ponds',fr:'FR-01 · AT-27',notes:['Form yang sama dipakai untuk ubah identitas.','Nama wajib unik; catatan dan ukuran tidak memengaruhi rumus.'],body:()=>`${field('Nama kolam *','Kolam Timur')}${field('Ukuran / catatan dimensi','', '')}<p class="hint">Opsional. Tidak digunakan dalam perhitungan pakan.</p><label>Catatan<textarea placeholder="Contoh: dekat pintu masuk"></textarea></label>${notice('Nama yang sama, termasuk perbedaan huruf besar dan kecil, tidak dapat digunakan.')}`,footer:()=>btn('Simpan kolam · simulasi','ponds')},
{id:'pond',group:'Kolam dan siklus',title:'Kolam Utara',back:'ponds',fr:'FR-01–02, FR-04–06 · AT-08–17',notes:['Kondisi saat ini terpisah dari riwayat transaksi.','Arsip nonaktif selama siklus aktif.','Panen akhir mempunyai konfirmasi tersendiri.'],body:()=>`<div class="pair">${badge('Siklus aktif')}${link('Ubah identitas','pondform')}</div><p class="small">Nila · Mulai 01 Okt 2026 · Pakan A</p>${section('Kondisi saat ini')}${card(`${kv('Populasi','100 ekor')}${kv('Bobot rata-rata','100 g/ikan')}${kv('Biomassa','10.000 g')}${kv('Feeding rate','3%')}`)}${card(`<div class="small">Kebutuhan terbaru</div><div class="value">300 <span>g/hari</span></div>${btn('Lihat pakan hari ini','feed','outline')}`)}<div class="grid2">${btn('Sampling','sampling','outline')}${btn('Kematian','death','outline')}${btn('Panen parsial','harvest','outline')}${btn('Riwayat','transactions','outline')}</div>${section('Atur siklus')}<div class="grid2">${btn('Ubah rate','rate','outline')}${btn('Jam besok','schedule','outline')}</div>${btn('Panen akhir / tutup siklus','final','outline')}<button class="btn" disabled>Arsip kolam tidak tersedia</button><p class="hint">Selesaikan siklus aktif sebelum mengarsipkan kolam.</p>`},
{id:'cycle',group:'Kolam dan siklus',title:'Mulai siklus',back:'ponds',fr:'FR-02, FR-04 · AT-02–03, 27',notes:['Pilih master pakan; tidak membuat acuan rate.','Tinjau sebelum menyimpan data awal dan jadwal sekaligus.'],body:()=>`<p class="small">Kolam Selatan · 15 Oktober 2026</p>${field('Jenis ikan *','Nila')}${field('Jumlah awal *','100','ekor')}${field('Bobot awal *','100','g/ikan')}<label>Pakan *<select><option>Pakan A</option></select></label>${field('Feeding rate manual *','3','%')}<p class="hint">Ikuti acuan Anda/dosen. Maksimal 2 desimal.</p>${field('Jam pertama *','08:00','','time')}${field('Jam kedua *','16:00','','time')}<p class="hint">1–6 jam unik. Data awal dan pakan dikunci setelah disimpan.</p>${notice('Pratinjau: 300 g/hari → 150 g + 150 g')}`,footer:()=>btn('Tinjau siklus','cycleconfirm')},
{id:'cycleconfirm',group:'Kolam dan siklus',title:'Tinjau siklus',back:'cycle',fr:'FR-02 · AT-02–03',notes:['Contoh ringkasan sebelum transaksi penting.','Simpan nonaktif selama proses; kesalahan mempertahankan draft.'],body:()=>`${card(`${kv('Kolam','Kolam Selatan')}${kv('Ikan / jumlah','Nila / 100 ekor')}${kv('Bobot awal','100 g/ikan')}${kv('Pakan / rate','Pakan A / 3%')}${kv('Jam pemberian','08.00 dan 16.00')}${kv('Kebutuhan awal','300 g/hari')}`)}${notice('Jumlah, bobot awal, jenis ikan, dan pakan dikunci setelah mulai siklus. Bobot berikutnya dicatat melalui sampling.')}`,footer:()=>btn('Mulai siklus · simulasi','ponds')},
{id:'feed',group:'Pakan dan stok',title:'Pakan',nav:2,fr:'FR-03–04 · AT-02, 04–10, 28',notes:['Kebutuhan, aktual, dan sisa selalu dibedakan.','Jam hari ini tetap walau template besok berubah.','Tidak ada pemberian nol atau di luar slot otomatis.'],body:()=>`<div class="tabs"><button class="on">Pemberian hari ini</button><button data-to="stock">Stok pakan</button></div><p class="small">15 Oktober 2026 · Kolam Utara</p>${card(`<h3>Kolam Utara</h3>${kv('Kebutuhan terbaru','300 g')}${kv('Sudah diberikan','150 g')}${kv('Sisa kebutuhan','150 g')}`)}${card(`<div class="slot"><time>08.00</time><div><strong>150 g</strong><div class="small">Aktual tersimpan</div></div>${badge('Diberikan')}</div>${link('Lihat detail','feedingdetail')}`)}${card(`<div class="slot"><time>16.00</time><div><strong>150 g</strong><div class="small">Porsi rencana</div></div>${badge('Menunggu','warn')}</div><div class="grid2">${btn('Berikan','feeding')}${btn('Lewati','skip','outline')}</div>`)}${btn('Ubah jam untuk besok','schedule','outline')}`},

const nav=[['home','Beranda','home'],['pond','Kolam','ponds'],['feed','Pakan','feed'],['report','Laporan','report']];
function phone(s){return `<div class="status"><span>14.10</span><span>▰ ▰ 86%</span></div>${s.id==='home'?'':`<div class="appbar">${s.back?`<button class="iconbtn" data-to="${s.back}" aria-label="Kembali">${icon('back')}</button>`:''}<h2>${s.title}</h2></div>`}<div class="content">${s.body()}</div>${s.footer?`<div class="footer">${s.footer()}</div>`:''}${s.keyboard?`<div class="keyboard" aria-label="Ilustrasi keyboard angka"><div class="keys">${['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(k=>`<span>${k}</span>`).join('')}</div><div class="small">Ilustrasi keyboard · tombol tetap terjangkau</div></div>`:''}${s.nav!==undefined?`<nav class="nav" aria-label="Navigasi utama">${nav.map(([i,t,id],n)=>`<button data-to="${id}" class="${s.nav===n?'active':''}">${icon(i)}${t}</button>`).join('')}</nav>`:''}`}
const picker=document.getElementById('picker');picker.innerHTML=screens.map((s,i)=>`<option value="${s.id}">${String(i+1).padStart(2,'0')} · ${s.title}</option>`).join('');let current='home';
let lastGroup='';document.getElementById('index').innerHTML=screens.map((s,i)=>{let g=s.group!==lastGroup?`<div class="group">${s.group}</div>`:'';lastGroup=s.group;return g+`<button data-to="${s.id}" id="item-${s.id}">${String(i+1).padStart(2,'0')} · ${s.title}</button>`}).join('');
function show(id){const s=screens.find(x=>x.id===id);if(!s)return;current=id;picker.value=id;document.getElementById('phone').innerHTML=phone(s);document.getElementById('note').innerHTML=`<div class="eyebrow">Catatan rancangan</div><h3>${s.title}</h3><ul>${s.notes.map(n=>`<li>${n}</li>`).join('')}</ul><div class="spec">${s.fr}</div><div class="spec">Data simulasi terisolasi.<br>Belum diterapkan ke aplikasi.</div>`;document.querySelectorAll('.index button').forEach(b=>b.classList.toggle('active',b.dataset.to===id));document.body.classList.remove('gallery');document.getElementById('gallery').textContent='Lihat semua layar';}
document.addEventListener('click',e=>{const t=e.target.closest('[data-to]');if(t)show(t.dataset.to)});picker.addEventListener('change',()=>show(picker.value));document.getElementById('gallery').onclick=()=>{const on=document.body.classList.toggle('gallery');document.getElementById('gallery').textContent=on?'Kembali ke prototipe':'Lihat semua layar';if(on&&!document.getElementById('board').children.length)document.getElementById('board').innerHTML=screens.map((s,i)=>`<article><h3 class="caption">${String(i+1).padStart(2,'0')} · ${s.title}</h3><section class="phone" aria-label="${s.title}">${phone(s)}</section></article>`).join('')};document.getElementById('print').onclick=()=>{if(!document.getElementById('board').children.length)document.getElementById('gallery').click();window.print()};show('home');
